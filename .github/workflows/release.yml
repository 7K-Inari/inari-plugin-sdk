name: release

# The release-please action self-detects merged Release PRs (by linked PR,
# not commit-message heuristics — robust under merge-commit and squash
# alike) and creates the tag + GitHub Release only then. The versioned
# artifact is the Go module itself: the tag IS the release.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          release-type: go
          skip-github-pull-request: true

      # Go module proxy sanity: after a tag exists, the module must resolve.
      - name: Verify module resolvable at tag
        if: steps.rp.outputs.release_created == 'true'
        env:
          GOPROXY: "https://proxy.golang.org"
        run: |
          sleep 10
          go mod download "github.com/7K-Inari/inari-plugin-sdk@${{ steps.rp.outputs.tag_name }}" || \
            echo "::warning::proxy may not have indexed ${{ steps.rp.outputs.tag_name }} yet"
