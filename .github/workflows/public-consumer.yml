name: public-consumer

on:
  workflow_dispatch:
    inputs:
      api_version:
        description: Public inari-api tag or commit containing extensions/v1
        required: true
      sdk_version:
        description: Public inari-plugin-sdk tag or commit to verify
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Verify clean public Go consumer
        env:
          INARI_API_VERSION: ${{ inputs.api_version }}
          INARI_PLUGIN_SDK_VERSION: ${{ inputs.sdk_version }}
        run: ./scripts/verify-public-consumer.sh
